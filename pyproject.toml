[project]
name = "hospital-readmission-prediction"
version = "0.1.0"
description = "Predict 30-day hospital readmission of diabetic patients (ML Zoomcamp 2026 midterm project)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "numpy",
    "pandas",
    "scikit-learn",
    "uvicorn",
    "xgboost",
]

[dependency-groups]
dev = [
    "jupyter",
    "matplotlib",
    "requests",
    "seaborn",
]
