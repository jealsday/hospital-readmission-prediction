apiVersion: apps/v1
kind: Deployment
metadata:
  name: readmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readmission
  template:
    metadata:
      labels:
        app: readmission
    spec:
      containers:
        - name: readmission
          image: hospital-readmission:v1
          # the image is loaded into kind, not pulled from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9696
          env:
            - name: RISK_THRESHOLD
              value: "0.2"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 15
            periodSeconds: 20
